name: Website

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: Syntax and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: for f in website/js/*.js; do node --check "$f"; done
      - name: Check every page links to existing local files
        run: node scripts/check-links.js website

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Lighthouse CI
        run: npm install -g @lhci/cli@0.14.0 && lhci autorun
